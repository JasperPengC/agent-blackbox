name: Bug report
description: Something behaves incorrectly, crashes, or reports wrong numbers
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The hardest part of a bug report is reproducing it,
        so please fill in as much of the following as possible.

        If the report involves session content, **redact it first** (paths, keys,
        source snippets).
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Live monitoring (blackbox live)
        - Recording / conversion (record / ingest)
        - Replay / timeline / zoom
        - Session overview / cost
        - Session comparison
        - DSH plugin
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Expected behaviour versus actual behaviour
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, URL including `?t=` or `?file=`, and session type
      placeholder: |
        1. `blackbox live 0489561a`
        2. Drag the timeline to ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS / Node version / browser / runtime involved
      placeholder: |
        macOS 15.3, Node 24.18.0, Chrome 141, session source DSH
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Summary of `blackbox stats <file> --json` and `blackbox adapters --json`.
        For plugin issues, include the latest log from
        `~/.dsh/profiles/<profile>/.plugin-manager/logs/`.
      render: shell
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I have removed sensitive content from real session data
          required: true
